[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netlag-monitor"
version = "0.1.0"
description = "DiagnÃ³stico de latÃªncia, jitter, perda de pacotes e bufferbloat para jogos online e home office."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Guilherme Menezes" }]
keywords = ["network", "latency", "jitter", "bufferbloat", "ping", "gaming"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = ["rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/guifqz/netlag-monitor"
Issues = "https://github.com/guifqz/netlag-monitor/issues"

[project.scripts]
netlag = "netlag.cli:main"

[tool.setuptools]
packages = ["netlag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
